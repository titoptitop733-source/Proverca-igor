[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-price-tracker"
version = "1.0.0"
description = "Track PC game prices across stores using the CheapShark API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
docs = ["reportlab>=4.0"]
shots = ["playwright>=1.40"]

[project.scripts]
game-tracker = "game_tracker.cli:main"

[project.gui-scripts]
game-tracker-gui = "game_tracker.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_tracker = ["web/static/*", "web/static/css/*", "web/static/js/*", "web/static/js/views/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Third-party deprecation inside starlette's TestClient, not caused by this project.
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]   # pycodestyle, pyflakes, isort, bugbear, pyupgrade

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

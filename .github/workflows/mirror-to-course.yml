# After every push to main, copy the branch to the official course repository (TUKE GitLab).
# One-way and without --force: if the course repository has commits that GitHub lacks,
# the push is rejected and this workflow fails, so nothing is ever overwritten silently.
#
# Needs one repository secret, COURSE_SSH_KEY: the PRIVATE part of a dedicated SSH key whose
# public part is added in GitLab (deploy key with write access, or an SSH key of the account).
# Without the secret the workflow does nothing, so the repository still works for everyone else.

name: Mirror to course repository

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-to-course
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to the course server
        env:
          COURSE_SSH_KEY: ${{ secrets.COURSE_SSH_KEY }}
          COURSE_HOST: git.kpi.fei.tuke.sk
          COURSE_REMOTE: git@git.kpi.fei.tuke.sk:python/2026/ivan-nerodyk.git
        run: |
          if [ -z "$COURSE_SSH_KEY" ]; then
            echo "COURSE_SSH_KEY is not set - skipping the mirror."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$COURSE_SSH_KEY" > ~/.ssh/course_key
          chmod 600 ~/.ssh/course_key
          ssh-keyscan -t ed25519 "$COURSE_HOST" >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/course_key -o IdentitiesOnly=yes" \
            git push "$COURSE_REMOTE" HEAD:main
